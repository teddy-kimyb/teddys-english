<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f5f5f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1c1c1a" media="(prefers-color-scheme: dark)">
<title>수특라이트 2차범위 단어장</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

:root {
  --bg: #ffffff;
  --bg2: #f5f5f0;
  --bg3: #e8e8e2;
  --text: #1a1a18;
  --text2: #6b6b67;
  --text3: #a0a09a;
  --border: rgba(0,0,0,0.10);
  --border2: rgba(0,0,0,0.20);
  --border3: rgba(0,0,0,0.35);
  --green: #1D9E75;
  --green-bg: #E1F5EE;
  --green-dark: #085041;
  --green-mid: #0F6E56;
  --amber: #EF9F27;
  --red-bg: #FCEBEB;
  --red-border: #F09595;
  --red-dark: #791F1F;
  --nav-h: 60px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --font: 'Pretendard', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif;
  --radius: 10px;
  --radius-lg: 16px;
}

@media (prefers-color-scheme: dark) {
  :root {
    --bg: #1c1c1a;
    --bg2: #252523;
    --bg3: #333330;
    --text: #f0efea;
    --text2: #9a9a94;
    --text3: #606058;
    --border: rgba(255,255,255,0.09);
    --border2: rgba(255,255,255,0.17);
    --border3: rgba(255,255,255,0.30);
    --green-bg: #04342C;
    --green-dark: #9FE1CB;
    --green-mid: #5DCAA5;
    --red-bg: #3a1010;
    --red-border: #a03030;
    --red-dark: #F7C1C1;
  }
}

html { height: 100%; }

body {
  font-family: var(--font);
  background: var(--bg2);
  color: var(--text);
  min-height: 100%;
  min-height: 100dvh;
  display: flex;
  flex-direction: column;
  overscroll-behavior: none;
}

/* ── 상단 헤더 ── */
.app-header {
  background: var(--bg);
  border-bottom: 0.5px solid var(--border2);
  padding: 14px 16px 12px;
  position: sticky;
  top: 0;
  z-index: 100;
}
.app-header h1 { font-size: 17px; font-weight: 600; color: var(--text); }
.app-header p { font-size: 12px; color: var(--text2); margin-top: 2px; }

/* ── 하단 네비 (모바일/태블릿) ── */
.bottom-nav {
  position: fixed;
  bottom: 0;
  left: 0; right: 0;
  background: var(--bg);
  border-top: 0.5px solid var(--border2);
  display: flex;
  padding-bottom: var(--safe-bottom);
  z-index: 200;
}
.nav-btn {
  flex: 1;
  border: none;
  background: none;
  cursor: pointer;
  padding: 10px 4px 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 3px;
  color: var(--text3);
  font-family: var(--font);
  font-size: 10px;
  transition: color 0.15s;
  -webkit-appearance: none;
}
.nav-btn i { font-size: 22px; line-height: 1; }
.nav-btn.active { color: var(--green); }

/* 스크롤 영역 */
.scroll-body {
  flex: 1;
  overflow-y: auto;
  padding: 16px 16px calc(var(--nav-h) + var(--safe-bottom) + 16px);
  -webkit-overflow-scrolling: touch;
}

.section { display: none; }
.section.active { display: block; }

/* ── 단어장 ── */
.toolbar {
  display: flex;
  gap: 8px;
  margin-bottom: 12px;
  align-items: center;
}
.search-wrap {
  flex: 1;
  position: relative;
}
.search-wrap i {
  position: absolute;
  left: 11px; top: 50%;
  transform: translateY(-50%);
  font-size: 16px;
  color: var(--text3);
  pointer-events: none;
}
.search-input {
  width: 100%;
  padding: 10px 12px 10px 34px;
  font-size: 15px;
  font-family: var(--font);
  border: 0.5px solid var(--border2);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--text);
  outline: none;
  -webkit-appearance: none;
  appearance: none;
}
.search-input:focus { border-color: var(--green); }

.prog-badge {
  font-size: 12px;
  color: var(--text2);
  white-space: nowrap;
  background: var(--bg3);
  padding: 8px 12px;
  border-radius: var(--radius);
  font-weight: 500;
}

.word-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 6px;
}
.word-card {
  background: var(--bg);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  padding: 13px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  transition: background 0.12s, border-color 0.12s;
  -webkit-user-select: none;
  user-select: none;
}
.word-card:active { background: var(--bg3); }
.word-card.known { border-color: var(--green); background: var(--green-bg); }
.eng {
  font-size: 14px;
  font-weight: 500;
  color: var(--text);
  flex: 0 0 auto;
  min-width: 110px;
  max-width: 44%;
}
.kor { font-size: 13px; color: var(--text2); flex: 1; line-height: 1.4; }
.word-card.known .eng { color: var(--green-dark); }
.word-card.known .kor { color: var(--green-mid); }
.star {
  font-size: 20px;
  color: var(--border2);
  flex-shrink: 0;
  padding: 4px;
  cursor: pointer;
  -webkit-user-select: none;
  user-select: none;
  transition: color 0.12s, transform 0.1s;
  line-height: 1;
}
.star:active { transform: scale(1.35); }
.star.on { color: var(--amber); }

/* ── 플래시카드 ── */
.fc-outer {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 14px;
  padding: 4px 0;
}
.fc-mode {
  display: flex;
  gap: 6px;
  width: 100%;
  justify-content: center;
}
.fc-mode-btn {
  flex: 1;
  max-width: 110px;
  padding: 9px 6px;
  border-radius: var(--radius);
  border: 0.5px solid var(--border2);
  background: var(--bg);
  cursor: pointer;
  color: var(--text2);
  font-family: var(--font);
  font-size: 13px;
  transition: all 0.12s;
  -webkit-appearance: none;
}
.fc-mode-btn.active { background: var(--green); color: #fff; border-color: var(--green); font-weight: 600; }

.fc-meta {
  display: flex;
  width: 100%;
  align-items: center;
  gap: 10px;
}
.card-counter { font-size: 13px; color: var(--text2); white-space: nowrap; }
.fc-progress { flex: 1; height: 5px; background: var(--bg3); border-radius: 3px; overflow: hidden; }
.fc-prog-fill { height: 100%; background: var(--green); border-radius: 3px; transition: width 0.35s; }

.flashcard {
  width: 100%;
  min-height: 200px;
  background: var(--bg);
  border: 0.5px solid var(--border2);
  border-radius: var(--radius-lg);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 2rem 1.5rem 3rem;
  cursor: pointer;
  position: relative;
  transition: border-color 0.15s;
  -webkit-user-select: none;
  user-select: none;
}
.flashcard:active { border-color: var(--border3); }
.fc-word { font-size: 28px; font-weight: 700; color: var(--text); text-align: center; line-height: 1.3; }
.fc-meaning { font-size: 17px; color: var(--text2); text-align: center; margin-top: 14px; display: none; line-height: 1.5; }
.fc-hint { font-size: 12px; color: var(--text3); position: absolute; bottom: 16px; }
.flashcard.revealed .fc-meaning { display: block; }
.flashcard.revealed .fc-hint { display: none; }

.fc-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; }
.fc-btn {
  padding: 14px 10px;
  border-radius: var(--radius);
  font-size: 15px;
  font-family: var(--font);
  cursor: pointer;
  border: 0.5px solid;
  font-weight: 600;
  transition: opacity 0.12s, transform 0.1s;
  -webkit-appearance: none;
}
.fc-btn:disabled { opacity: 0.28; cursor: default; }
.fc-btn:not(:disabled):active { transform: scale(0.97); }
.btn-wrong { background: var(--red-bg); border-color: var(--red-border); color: var(--red-dark); }
.btn-right { background: var(--green-bg); border-color: var(--green); color: var(--green-dark); }

.btn-next-full {
  width: 100%;
  padding: 14px;
  background: var(--bg3);
  border: 0.5px solid var(--border2);
  border-radius: var(--radius);
  font-size: 15px;
  font-family: var(--font);
  font-weight: 600;
  cursor: pointer;
  color: var(--text);
  display: none;
  -webkit-appearance: none;
}
.btn-next-full:active { opacity: 0.75; }

/* ── 퀴즈 ── */
.quiz-score {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  margin-bottom: 14px;
}
.score-chip {
  background: var(--bg);
  border: 0.5px solid var(--border);
  border-radius: var(--radius);
  padding: 10px 6px;
  text-align: center;
  font-size: 11px;
  color: var(--text2);
}
.score-chip span { display: block; font-size: 22px; font-weight: 700; color: var(--text); line-height: 1.2; margin-bottom: 2px; }

.quiz-q {
  font-size: 18px;
  font-weight: 600;
  color: var(--text);
  text-align: center;
  margin-bottom: 14px;
  padding: 20px 16px;
  background: var(--bg);
  border: 0.5px solid var(--border);
  border-radius: var(--radius-lg);
  line-height: 1.5;
  word-break: keep-all;
}
.quiz-opts {
  display: grid;
  grid-template-columns: 1fr;
  gap: 8px;
  margin-bottom: 12px;
}
.quiz-opt {
  padding: 14px 16px;
  border: 0.5px solid var(--border2);
  border-radius: var(--radius);
  background: var(--bg);
  cursor: pointer;
  font-size: 14px;
  font-family: var(--font);
  color: var(--text);
  text-align: left;
  line-height: 1.4;
  font-weight: 500;
  transition: background 0.12s;
  -webkit-appearance: none;
  word-break: keep-all;
}
.quiz-opt:active:not(:disabled) { background: var(--bg3); }
.quiz-opt.correct { background: var(--green-bg); border-color: var(--green); color: var(--green-dark); }
.quiz-opt.wrong { background: var(--red-bg); border-color: var(--red-border); color: var(--red-dark); }
.quiz-opt:disabled { cursor: default; }

.quiz-feedback {
  text-align: center;
  font-size: 14px;
  padding: 12px;
  border-radius: var(--radius);
  margin-bottom: 12px;
  font-weight: 600;
  word-break: keep-all;
}
.quiz-feedback.ok { background: var(--green-bg); color: var(--green-dark); }
.quiz-feedback.ng { background: var(--red-bg); color: var(--red-dark); }

.btn-primary {
  width: 100%;
  padding: 15px;
  background: var(--green);
  border: none;
  border-radius: var(--radius);
  font-size: 15px;
  font-family: var(--font);
  cursor: pointer;
  color: #fff;
  font-weight: 700;
  -webkit-appearance: none;
}
.btn-primary:active { opacity: 0.82; }

.quiz-result { text-align: center; padding: 2rem 1rem; }
.quiz-result .big { font-size: 56px; font-weight: 800; color: var(--text); }
.quiz-result .sub { font-size: 15px; color: var(--text2); margin-top: 8px; margin-bottom: 1.5rem; }

/* ── 태블릿 600px+ ── */
@media (min-width: 600px) {
  .app-header { padding: 16px 24px 14px; }
  .app-header h1 { font-size: 19px; }
  .app-header p { font-size: 13px; }
  .scroll-body { padding: 20px 24px calc(var(--nav-h) + var(--safe-bottom) + 20px); }
  .word-grid { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .quiz-opts { grid-template-columns: 1fr 1fr; }
  .fc-word { font-size: 32px; }
  .flashcard { min-height: 230px; }
  .nav-btn { font-size: 11px; }
  .nav-btn i { font-size: 24px; }
}

/* ── 데스크탑 900px+: 하단 네비 → 상단 탭 ── */
@media (min-width: 900px) {
  .app-header { padding: 18px 36px 0; border-bottom: none; }
  .app-header h1 { font-size: 21px; }

  .bottom-nav { display: none; }

  .desktop-tabs {
    display: flex !important;
    gap: 0;
    padding: 0 36px;
    background: var(--bg);
    border-bottom: 0.5px solid var(--border2);
  }
  .desktop-tab {
    padding: 10px 22px;
    border: none;
    background: none;
    cursor: pointer;
    color: var(--text2);
    font-family: var(--font);
    font-size: 14px;
    border-bottom: 2px solid transparent;
    margin-bottom: -0.5px;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: color 0.12s;
    font-weight: 500;
  }
  .desktop-tab.active { color: var(--text); border-bottom-color: var(--green); }
  .desktop-tab:hover:not(.active) { color: var(--text); }

  .scroll-body {
    padding: 28px 36px 40px;
    max-width: 1000px;
    margin: 0 auto;
    width: 100%;
  }
  .word-grid { grid-template-columns: repeat(3, 1fr); }

  .fc-outer { max-width: 580px; margin: 0 auto; }
  .flashcard { min-height: 270px; }
  .fc-word { font-size: 36px; }
  .fc-meaning { font-size: 20px; }

  .quiz-score { max-width: 500px; margin: 0 auto 16px; }
  .quiz-q { max-width: 620px; margin: 0 auto 14px; font-size: 20px; }
  .quiz-opts { max-width: 620px; margin: 0 auto 12px; }
  .quiz-feedback { max-width: 620px; margin: 0 auto 12px; }
  .btn-primary { max-width: 200px; margin: 0 auto; display: block; width: auto; padding: 13px 32px; }
}

/* 데스크탑 탭 기본 숨김 */
.desktop-tabs { display: none; }

button:focus-visible, input:focus-visible {
  outline: 2px solid var(--green);
  outline-offset: 2px;
}
</style>
</head>
<body>

<div class="app-header">
  <h1>📚 수특라이트 2차범위 단어장</h1>
  <p>총 129개 단어 · 탭하여 암기 표시 / ★ 즐겨찾기</p>
</div>

<!-- 데스크탑 탭 -->
<div class="desktop-tabs" id="desktop-tabs">
  <button class="desktop-tab active" onclick="switchTab('list')"><i class="ti ti-list"></i> 단어장</button>
  <button class="desktop-tab" onclick="switchTab('flash')"><i class="ti ti-cards"></i> 플래시카드</button>
  <button class="desktop-tab" onclick="switchTab('quiz')"><i class="ti ti-pencil"></i> 퀴즈</button>
</div>

<div class="scroll-body">

  <!-- 단어장 -->
  <div class="section active" id="sec-list">
    <div class="toolbar">
      <div class="search-wrap">
        <i class="ti ti-search"></i>
        <input class="search-input" type="search" id="search" placeholder="단어 검색..." oninput="renderList()"
          autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      </div>
      <span class="prog-badge" id="known-count">암기 0/129</span>
    </div>
    <div class="word-grid" id="word-grid"></div>
  </div>

  <!-- 플래시카드 -->
  <div class="section" id="sec-flash">
    <div class="fc-outer">
      <div class="fc-mode">
        <button class="fc-mode-btn active" id="mode-all" onclick="setMode('all')">전체</button>
        <button class="fc-mode-btn" id="mode-unknown" onclick="setMode('unknown')">미암기</button>
        <button class="fc-mode-btn" id="mode-starred" onclick="setMode('starred')">즐겨찾기</button>
      </div>
      <div class="fc-meta">
        <div class="card-counter" id="fc-counter">0 / 0</div>
        <div class="fc-progress"><div class="fc-prog-fill" id="fc-fill" style="width:0%"></div></div>
      </div>
      <div class="flashcard" id="flashcard" onclick="revealCard()">
        <div class="fc-word" id="fc-word">—</div>
        <div class="fc-meaning" id="fc-meaning"></div>
        <span class="fc-hint">탭하여 뜻 보기</span>
      </div>
      <div class="fc-btns">
        <button class="fc-btn btn-wrong" id="btn-wrong" onclick="judge(false)" disabled>✗ 모르겠어요</button>
        <button class="fc-btn btn-right" id="btn-right" onclick="judge(true)" disabled>✓ 알아요</button>
      </div>
      <button class="btn-next-full" id="btn-next" onclick="nextCard()">다음 →</button>
    </div>
  </div>

  <!-- 퀴즈 -->
  <div class="section" id="sec-quiz">
    <div class="quiz-score">
      <div class="score-chip"><span id="q-correct">0</span>맞춤</div>
      <div class="score-chip"><span id="q-wrong">0</span>틀림</div>
      <div class="score-chip"><span id="q-remain">—</span>남은 문제</div>
    </div>
    <div id="quiz-body"></div>
  </div>

</div>

<!-- 모바일/태블릿 하단 네비 -->
<nav class="bottom-nav">
  <button class="nav-btn active" id="nav-list" onclick="switchTab('list')">
    <i class="ti ti-list"></i>단어장
  </button>
  <button class="nav-btn" id="nav-flash" onclick="switchTab('flash')">
    <i class="ti ti-cards"></i>플래시카드
  </button>
  <button class="nav-btn" id="nav-quiz" onclick="switchTab('quiz')">
    <i class="ti ti-pencil"></i>퀴즈
  </button>
</nav>

<script>
const RAW = [
  ["excelled","뛰어났다, 탁월했다"],["yearned","간절히 바랐다"],["sickly","병약한"],["surface tension","표면 장력"],["device","장치, 기구"],["impressed","감명받은"],["honorary doctorate","명예 박사 학위"],["theologian","신학자"],["abandoned","포기했다, 그만뒀다"],["interrupted","중단되었다"],["physiology","생리학"],["acclaimed","호평받는"],["professorship","교수직"],["retirement","은퇴"],["instinctively","본능적으로"],["intuitive","직관적인"],["emotional contagion","감정 전염"],["epidemic","전염병, 유행"],["varying","다양한"],["instantly","즉각적으로"],["depth-perception","거리 감각"],["dense","빽빽한, 울창한"],["accompanied","동행했다"],["herd","무리"],["estimating","추정하는"],["horizon","지평선"],["conceptual change","개념적 변화"],["overwritten","덮어쓰여진, 대체된"],["inhibitory control","억제적 통제"],["suppress","억누르다, 억제하다"],["naive","순진한, 단순한"],["deliberate","의도적인, 신중한"],["retrieved","되살려진, 불러온"],["perceptual","지각적인"],["symbolism","상징주의"],["nonverbal","비언어적인"],["psychotherapy","심리 치료"],["interpretation","해석"],["energize","활력을 주다"],["incorporates","통합하다, 포함하다"],["narratives","서사, 이야기"],["geospatial","지리 공간 정보의"],["overlaying","겹쳐 분석하는"],["algorithmically","알고리즘적으로"],["spatial turn","공간적 전환"],["ethical particularism","윤리적 특수주의"],["universal","보편적인"],["circumstance","상황, 환경"],["axe-wielding","도끼를 든"],["villain","악당"],["flexible","유연한"],["engagement","참여, 관여"],["nuances","미묘한 차이"],["generalized","일반화된"],["impatience","조급함"],["overestimate","과대평가하다"],["underestimate","과소평가하다"],["assets","자산"],["consumables","소모품"],["financial risk","재무적 위험"],["acquisition","취득, 구입"],["disposal","처분"],["reliever","완화 수단"],["arsenal","무기고, 수단"],["guarantee","보장, 보증"],["nonrefundable","환불 불가의"],["voucher","상품권, 쿠폰"],["departure","출발"],["indigenous","토착의, 원주민의"],["intergenerational","세대 간의"],["transmission","전달, 전수"],["biocultural","생물문화적인"],["fermented food","발효 식품"],["intervention","개입, 중재"],["preservation","보존"],["persistence","지속성"],["asynchronous","비동시성의"],["ephemeral","덧없는, 순식간에 사라지는"],["unprecedented","전례 없는"],["implications","함의, 영향"],["expire","만료되다"],["spontaneous","즉흥적인, 자연발생적인"],["manoeuvrability","기동 능력"],["predators","포식자"],["aerial locomotion","공중 이동"],["territorial expansion","영역 확장"],["hostile","적대적인, 열악한"],["seasonal migration","계절 이동"],["abbreviation","줄임말, 약어"],["transmit","전달하다"],["jealousy","질투"],["betrayal","배신"],["identifying","동일시하다"],["intense","강렬한"],["evolving","진화하는"],["demographic","인구층"],["broadcaster","방송사"],["distraction","오락 거리, 주의 분산"],["extract","추출하다"],["commonalities","공통점"],["groupings","분류, 그룹화"],["merged","합쳐진"],["inborn","타고난"],["pitch space","음고 공간"],["cluster","무리, 덩어리"],["distinct","뚜렷이 구별되는"],["errand","볼일, 심부름"],["commute","통근"],["inexpensive","저렴한"],["fragile","취약한, 깨지기 쉬운"],["insomnia","불면증"],["fragmentation","분절, 파편화"],["subjective","주관적인"],["undisturbed","방해받지 않은"],["perceive","인식하다"],["adequate","충분한, 적절한"],["paradox","역설"],["sustainability","지속 가능성"],["espouse","지지하다, 옹호하다"],["deplete","고갈시키다"],["greenwash","위장 환경주의"],["trade-off","균형, 절충"],["unsustainable","지속 불가능한"],["occupational burnout","직업적 소진"],["prolonged","장기적인, 오래 지속된"],["chronic strain","만성적 부담"],["overtraining syndrome","과훈련 증후군"],["underrecovery","불충분한 회복"],["intensification","강화, 심화"]
];

let known = new Set();
let starred = new Set();

try {
  const k = localStorage.getItem('voc2_known');
  const s = localStorage.getItem('voc2_starred');
  if(k) known = new Set(JSON.parse(k));
  if(s) starred = new Set(JSON.parse(s));
} catch(e){}

function save() {
  try {
    localStorage.setItem('voc2_known', JSON.stringify([...known]));
    localStorage.setItem('voc2_starred', JSON.stringify([...starred]));
  } catch(e){}
}

const TABS = ['list','flash','quiz'];

function switchTab(t) {
  TABS.forEach(id => {
    document.getElementById('sec-'+id).classList.toggle('active', id===t);
  });
  document.querySelectorAll('.nav-btn').forEach((b,i)=>b.classList.toggle('active', TABS[i]===t));
  document.querySelectorAll('.desktop-tab').forEach((b,i)=>b.classList.toggle('active', TABS[i]===t));
  if(t==='flash') initFlash();
  if(t==='quiz') initQuiz();
}

/* ── 단어장 ── */
function renderList() {
  const q = document.getElementById('search').value.toLowerCase();
  const grid = document.getElementById('word-grid');
  grid.innerHTML = '';
  RAW.filter(([e,k])=>!q||e.toLowerCase().includes(q)||k.includes(q)).forEach(([e,k])=>{
    const idx = RAW.findIndex(r=>r[0]===e);
    const card = document.createElement('div');
    card.className = 'word-card'+(known.has(idx)?' known':'');
    card.innerHTML = `<span class="eng">${e}</span><span class="kor">${k}</span><span class="star${starred.has(idx)?' on':''}" onclick="toggleStar(event,${idx})">★</span>`;
    card.onclick = ()=>toggleKnown(idx);
    grid.appendChild(card);
  });
  document.getElementById('known-count').textContent = `암기 ${known.size}/${RAW.length}`;
}

function toggleKnown(idx) {
  known.has(idx)?known.delete(idx):known.add(idx);
  save(); renderList();
}
function toggleStar(e,idx) {
  e.stopPropagation();
  starred.has(idx)?starred.delete(idx):starred.add(idx);
  save(); renderList();
}

/* ── 플래시카드 ── */
let fcDeck=[],fcIdx=0,fcRevealed=false,fcMode='all';

function setMode(m) {
  fcMode=m;
  document.querySelectorAll('.fc-mode-btn').forEach(b=>b.classList.remove('active'));
  document.getElementById('mode-'+m).classList.add('active');
  initFlash();
}

function initFlash() {
  let pool=RAW.map((_,i)=>i);
  if(fcMode==='unknown') pool=pool.filter(i=>!known.has(i));
  if(fcMode==='starred') pool=pool.filter(i=>starred.has(i));
  fcDeck=pool.sort(()=>Math.random()-0.5);
  fcIdx=0; fcRevealed=false;
  if(!fcDeck.length){
    document.getElementById('fc-word').textContent='단어가 없습니다';
    document.getElementById('fc-meaning').textContent='';
    document.getElementById('fc-counter').textContent='0 / 0';
    document.getElementById('fc-fill').style.width='0%';
    document.getElementById('btn-wrong').disabled=true;
    document.getElementById('btn-right').disabled=true;
    return;
  }
  showCard();
}

function showCard() {
  if(fcIdx>=fcDeck.length){showFCDone();return;}
  const[e,k]=RAW[fcDeck[fcIdx]];
  document.getElementById('flashcard').className='flashcard';
  fcRevealed=false;
  document.getElementById('fc-word').textContent=e;
  document.getElementById('fc-meaning').textContent=k;
  document.getElementById('fc-counter').textContent=`${fcIdx+1} / ${fcDeck.length}`;
  document.getElementById('fc-fill').style.width=`${Math.round(fcIdx/fcDeck.length*100)}%`;
  document.getElementById('btn-wrong').disabled=true;
  document.getElementById('btn-right').disabled=true;
  document.getElementById('btn-next').style.display='none';
}

function revealCard() {
  if(fcRevealed)return;
  fcRevealed=true;
  document.getElementById('flashcard').classList.add('revealed');
  document.getElementById('btn-wrong').disabled=false;
  document.getElementById('btn-right').disabled=false;
}

function judge(isRight) {
  const idx=fcDeck[fcIdx];
  isRight?known.add(idx):known.delete(idx);
  save(); fcIdx++;
  fcIdx<fcDeck.length?showCard():showFCDone();
}

function nextCard(){fcIdx++;showCard();}

function showFCDone() {
  document.getElementById('fc-word').textContent='완료! 🎉';
  document.getElementById('fc-meaning').textContent=`${fcDeck.length}개 학습 완료`;
  document.getElementById('flashcard').classList.add('revealed');
  document.getElementById('fc-counter').textContent=`${fcDeck.length} / ${fcDeck.length}`;
  document.getElementById('fc-fill').style.width='100%';
  document.getElementById('btn-wrong').disabled=true;
  document.getElementById('btn-right').disabled=true;
}

/* ── 퀴즈 ── */
let qPool=[],qIdx=0,qCorrect=0,qWrong=0,qAnswered=false;

function initQuiz() {
  qPool=RAW.map((_,i)=>i).sort(()=>Math.random()-0.5);
  qIdx=0; qCorrect=0; qWrong=0; qAnswered=false;
  updateQScore(); renderQuiz();
}

function updateQScore() {
  document.getElementById('q-correct').textContent=qCorrect;
  document.getElementById('q-wrong').textContent=qWrong;
  document.getElementById('q-remain').textContent=qPool.length-qIdx;
}

function renderQuiz() {
  const body=document.getElementById('quiz-body');
  if(qIdx>=qPool.length){showQuizResult();return;}
  const ci=qPool[qIdx];
  const[eng,kor]=RAW[ci];
  const isE2K=Math.random()>0.5;
  const wrongs=RAW.filter((_,i)=>i!==ci).sort(()=>Math.random()-0.5).slice(0,3);
  const correct=isE2K?kor:eng;
  const opts=[correct,...(isE2K?wrongs.map(w=>w[1]):wrongs.map(w=>w[0]))].sort(()=>Math.random()-0.5);
  const q=isE2K?`"${eng}"의 뜻은?`:`"${kor}"를 영어로?`;
  body.innerHTML=`
    <div class="quiz-q">${q}</div>
    <div class="quiz-opts" id="quiz-opts">
      ${opts.map(o=>`<button class="quiz-opt" onclick="pickOpt(this,${JSON.stringify(o)},${JSON.stringify(correct)})">${o}</button>`).join('')}
    </div>
    <div id="quiz-feedback"></div>
    <button class="btn-primary" id="next-q-btn" onclick="nextQ()" style="display:none">다음 문제 →</button>
  `;
  qAnswered=false;
}

function pickOpt(el,chosen,correct) {
  if(qAnswered)return;
  qAnswered=true;
  document.querySelectorAll('.quiz-opt').forEach(b=>b.disabled=true);
  const fb=document.getElementById('quiz-feedback');
  if(chosen===correct){
    el.classList.add('correct'); qCorrect++;
    fb.className='quiz-feedback ok'; fb.textContent='✓ 정답입니다!';
  } else {
    el.classList.add('wrong');
    document.querySelectorAll('.quiz-opt').forEach(b=>{if(b.textContent===correct)b.classList.add('correct');});
    qWrong++;
    fb.className='quiz-feedback ng'; fb.textContent=`✗ 오답 — 정답: ${correct}`;
  }
  updateQScore();
  document.getElementById('next-q-btn').style.display='block';
}

function nextQ(){qIdx++;updateQScore();renderQuiz();}

function showQuizResult() {
  const total=qCorrect+qWrong;
  const pct=total>0?Math.round(qCorrect/total*100):0;
  const emoji=pct>=80?'🎉':pct>=60?'👍':'💪';
  document.getElementById('quiz-body').innerHTML=`
    <div class="quiz-result">
      <div class="big">${pct}% ${emoji}</div>
      <div class="sub">${total}문제 중 ${qCorrect}개 정답</div>
      <button class="btn-primary" onclick="initQuiz()">다시 풀기</button>
    </div>
  `;
}

renderList();
</script>
</body>
</html>
