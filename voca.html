<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#4F46E5">
<title>수능특강 영어 어휘장</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    color: #1f2937;
    overscroll-behavior: none;
  }
  
  .container {
    max-width: 800px;
    margin: 0 auto;
    padding: 16px;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  
  header {
    text-align: center;
    color: white;
    padding: 12px 0 20px;
  }
  
  header h1 {
    font-size: 1.5rem;
    font-weight: 700;
    margin-bottom: 4px;
  }
  
  header p {
    font-size: 0.85rem;
    opacity: 0.9;
  }
  
  .tabs {
    display: flex;
    background: rgba(255,255,255,0.2);
    border-radius: 12px;
    padding: 4px;
    margin-bottom: 16px;
    backdrop-filter: blur(10px);
  }
  
  .tab {
    flex: 1;
    padding: 10px;
    text-align: center;
    color: white;
    font-size: 0.9rem;
    font-weight: 600;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.2s;
    border: none;
    background: transparent;
  }
  
  .tab.active {
    background: white;
    color: #4F46E5;
  }
  
  .toolbar {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  
  .search-box {
    flex: 1;
    padding: 12px 16px;
    border: none;
    border-radius: 12px;
    font-size: 0.95rem;
    background: white;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    outline: none;
  }
  
  .icon-btn {
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 12px;
    background: white;
    font-size: 1.2rem;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  
  .icon-btn:active { transform: scale(0.95); }
  
  .progress-bar {
    background: rgba(255,255,255,0.3);
    border-radius: 8px;
    height: 6px;
    margin-bottom: 12px;
    overflow: hidden;
  }
  
  .progress-fill {
    background: white;
    height: 100%;
    transition: width 0.3s;
    border-radius: 8px;
  }
  
  .progress-text {
    color: white;
    font-size: 0.85rem;
    text-align: center;
    margin-bottom: 12px;
  }
  
  /* 카드 모드 */
  .card-container {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    perspective: 1000px;
    min-height: 320px;
    margin-bottom: 16px;
  }
  
  .card {
    width: 100%;
    height: 320px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.6s;
    cursor: pointer;
  }
  
  .card.flipped { transform: rotateY(180deg); }
  
  .card-face {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    background: white;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 24px;
    text-align: center;
  }
  
  .card-back { transform: rotateY(180deg); }
  
  .word-en {
    font-size: 2rem;
    font-weight: 700;
    color: #1f2937;
    margin-bottom: 12px;
    word-break: break-word;
  }
  
  .word-ko {
    font-size: 1.6rem;
    font-weight: 600;
    color: #4F46E5;
    word-break: keep-all;
  }
  
  .card-hint {
    position: absolute;
    bottom: 16px;
    font-size: 0.75rem;
    color: #9ca3af;
  }
  
  .star-btn {
    position: absolute;
    top: 16px;
    right: 16px;
    background: none;
    border: none;
    font-size: 1.5rem;
    cursor: pointer;
    color: #d1d5db;
    transition: color 0.2s;
  }
  
  .star-btn.active { color: #fbbf24; }
  
  .controls {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }
  
  .nav-btn {
    flex: 1;
    padding: 14px;
    border: none;
    border-radius: 12px;
    background: white;
    color: #4F46E5;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  
  .nav-btn:active { transform: scale(0.97); }
  .nav-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  
  .nav-btn.primary {
    background: #4F46E5;
    color: white;
  }
  
  /* 리스트 모드 */
  .word-list {
    background: white;
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
    flex: 1;
    overflow-y: auto;
    max-height: 70vh;
  }
  
  .word-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    border-bottom: 1px solid #f3f4f6;
    gap: 12px;
  }
  
  .word-item:last-child { border-bottom: none; }
  
  .word-item-en {
    font-weight: 600;
    color: #1f2937;
    font-size: 0.95rem;
    flex-shrink: 0;
    max-width: 45%;
    word-break: break-word;
  }
  
  .word-item-ko {
    color: #6b7280;
    font-size: 0.9rem;
    text-align: right;
    word-break: keep-all;
  }
  
  .word-item-star {
    background: none;
    border: none;
    font-size: 1.2rem;
    color: #d1d5db;
    cursor: pointer;
    padding: 4px;
  }
  
  .word-item-star.active { color: #fbbf24; }
  
  /* 퀴즈 모드 */
  .quiz-container {
    background: white;
    border-radius: 20px;
    padding: 24px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.15);
  }
  
  .quiz-question {
    text-align: center;
    margin-bottom: 24px;
  }
  
  .quiz-label {
    font-size: 0.85rem;
    color: #6b7280;
    margin-bottom: 8px;
  }
  
  .quiz-word {
    font-size: 1.8rem;
    font-weight: 700;
    color: #1f2937;
    word-break: break-word;
  }
  
  .quiz-options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  
  .quiz-option {
    padding: 14px 16px;
    background: #f9fafb;
    border: 2px solid #e5e7eb;
    border-radius: 12px;
    font-size: 0.95rem;
    cursor: pointer;
    text-align: left;
    transition: all 0.2s;
    word-break: keep-all;
  }
  
  .quiz-option:active { transform: scale(0.98); }
  .quiz-option.correct { background: #d1fae5; border-color: #10b981; color: #065f46; }
  .quiz-option.wrong { background: #fee2e2; border-color: #ef4444; color: #991b1b; }
  
  .quiz-result {
    text-align: center;
    margin-top: 16px;
    font-weight: 600;
    color: #6b7280;
  }
  
  /* 모달 */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 100;
    padding: 16px;
  }
  
  .modal-overlay.active { display: flex; }
  
  .modal {
    background: white;
    border-radius: 16px;
    padding: 24px;
    max-width: 400px;
    width: 100%;
  }
  
  .modal h3 {
    margin-bottom: 16px;
    font-size: 1.2rem;
  }
  
  .modal-actions {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  
  .modal-btn {
    padding: 12px;
    border: none;
    border-radius: 10px;
    font-size: 0.95rem;
    font-weight: 600;
    cursor: pointer;
    background: #f3f4f6;
  }
  
  .modal-btn.primary { background: #4F46E5; color: white; }
  
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0,0,0,0.85);
    color: white;
    padding: 12px 24px;
    border-radius: 24px;
    font-size: 0.9rem;
    z-index: 200;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  
  .toast.show { opacity: 1; }
  
  @media (min-width: 768px) {
    header h1 { font-size: 1.8rem; }
    .word-en { font-size: 2.4rem; }
    .word-ko { font-size: 1.9rem; }
    .quiz-word { font-size: 2.2rem; }
    .card { height: 380px; }
  }
</style>
</head>
<body>

<div class="container">
  <header>
    <h1>📚 수능특강 영어 어휘장</h1>
    <p id="totalCount">전체 단어 로딩 중...</p>
  </header>
  
  <div class="tabs">
    <button class="tab active" data-mode="card">카드</button>
    <button class="tab" data-mode="list">목록</button>
    <button class="tab" data-mode="quiz">퀴즈</button>
    <button class="tab" data-mode="star">⭐</button>
  </div>
  
  <div class="toolbar">
    <input type="text" class="search-box" id="searchInput" placeholder="🔍 영어 또는 한국어 검색...">
    <button class="icon-btn" id="shuffleBtn" title="섞기">🔀</button>
    <button class="icon-btn" id="shareBtn" title="공유">📤</button>
  </div>
  
  <div class="progress-bar">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="progress-text" id="progressText">0 / 0</div>
  
  <!-- 카드 모드 -->
  <div id="cardMode">
    <div class="card-container">
      <div class="card" id="card">
        <div class="card-face card-front">
          <button class="star-btn" id="starBtn">☆</button>
          <div class="word-en" id="wordEn">단어를 불러오는 중...</div>
          <div class="card-hint">탭하여 뜻 확인</div>
        </div>
        <div class="card-face card-back">
          <div class="word-ko" id="wordKo">-</div>
          <div class="card-hint">탭하여 단어 확인</div>
        </div>
      </div>
    </div>
    <div class="controls">
      <button class="nav-btn" id="prevBtn">◀ 이전</button>
      <button class="nav-btn primary" id="nextBtn">다음 ▶</button>
    </div>
  </div>
  
  <!-- 리스트 모드 -->
  <div id="listMode" style="display:none;">
    <div class="word-list" id="wordList"></div>
  </div>
  
  <!-- 퀴즈 모드 -->
  <div id="quizMode" style="display:none;">
    <div class="quiz-container">
      <div class="quiz-question">
        <div class="quiz-label">다음 단어의 뜻은?</div>
        <div class="quiz-word" id="quizWord">-</div>
      </div>
      <div class="quiz-options" id="quizOptions"></div>
      <div class="quiz-result" id="quizResult">정답: 0 / 오답: 0</div>
    </div>
  </div>
</div>

<!-- 공유 모달 -->
<div class="modal-overlay" id="shareModal">
  <div class="modal">
    <h3>📤 공유하기</h3>
    <div class="modal-actions">
      <button class="modal-btn primary" id="copyUrlBtn">🔗 URL 복사하기</button>
      <button class="modal-btn" id="shareNativeBtn">📱 다른 앱으로 공유</button>
      <button class="modal-btn" id="closeModalBtn">닫기</button>
    </div>
  </div>
</div>

<div class="toast" id="toast">메시지</div>

<script>
// 어휘 데이터
const vocabulary = [
  ["excelled", "뛰어났다"],
  ["yearned", "간절히 바랐다"],
  ["sickly", "병약한"],
  ["surface tension", "표면 장력"],
  ["device", "장치, 기구"],
  ["impressed", "감명받은"],
  ["honorary doctorate", "명예 박사 학위"],
  ["theologian", "신학자"],
  ["abandoned", "포기했다"],
  ["interrupted", "중단되었다"],
  ["physiology", "생리학"],
  ["acclaimed", "호평받는"],
  ["professorship", "교수직"],
  ["retirement", "은퇴"],
  ["instinctively", "본능적으로"],
  ["intuitive", "직관적인"],
  ["emotional contagion", "감정 전염"],
  ["epidemic", "전염병 유행"],
  ["varying", "다양한"],
  ["instantly", "즉각적으로"],
  ["depth-perception", "거리 감각"],
  ["dense", "빽빽한, 울창한"],
  ["accompanied", "동행했다"],
  ["herd", "무리"],
  ["estimating", "추정하는"],
  ["horizon", "지평선"],
  ["conceptual change", "개념적 변화"],
  ["overwritten", "덮어쓰여진, 대체된"],
  ["inhibitory control", "억제적 통제"],
  ["suppress", "억누르다, 억제하다"],
  ["naive", "순진한, 단순한"],
  ["deliberate", "의도적인, 신중한"],
  ["retrieved", "되살려진, 불러온"],
  ["perceptual", "지각적인"],
  ["symbolism", "상징주의"],
  ["nonverbal", "비언어적인"],
  ["psychotherapy", "심리 치료"],
  ["interpretation", "해석"],
  ["energize", "활력을 주다"],
  ["incorporates", "통합하다, 포함하다"],
  ["narratives", "서사, 이야기"],
  ["geospatial", "지리 공간 정보의"],
  ["overlaying", "겹쳐 분석하는"],
  ["consumables", "소모품"],
  ["financial risk", "재무적 위험"],
  ["acquisition", "취득, 구입"],
  ["disposal", "처분"],
  ["reliever", "완화 수단"],
  ["arsenal", "무기고, 수단"],
  ["guarantee", "보장, 보증"],
  ["nonrefundable", "환불 불가의"],
  ["voucher", "상품권, 쿠폰"],
  ["departure", "출발"],
  ["indigenous", "토착의, 원주민의"],
  ["intergenerational", "세대 간의"],
  ["transmission", "전달, 전수"],
  ["biocultural", "생물문화적인"],
  ["fermented food", "발효 식품"],
  ["intervention", "개입, 중재"],
  ["preservation", "보존"],
  ["persistence", "지속성"],
  ["asynchronous", "비동시성의"],
  ["ephemeral", "덧없는, 순식간에 사라지는"],
  ["unprecedented", "전례 없는"],
  ["implications", "함의, 영향"],
  ["expire", "만료되다"],
  ["spontaneous", "즉흥적인, 자연발생적인"],
  ["manoeuvrability", "기동 능력"],
  ["predators", "포식자"],
  ["aerial locomotion", "공중 이동"],
  ["territorial expansion", "영역 확장"],
  ["hostile", "적대적인, 열악한"],
  ["seasonal migration", "계절 이동"],
  ["abbreviation", "줄임말, 약어"],
  ["transmit", "전달하다"],
  ["jealousy", "질투"],
  ["betrayal", "배신"],
  ["identifying", "동일시하다"],
  ["intense", "강렬한"],
  ["evolving", "진화하는"],
  ["demographic", "인구층"],
  ["broadcaster", "방송사"],
  ["distraction", "오락거리, 주의 분산"],
  ["extract", "추출하다"],
  ["commonalities", "공통점"],
  ["sustainability", "지속 가능성"],
  ["espouse", "지지하다, 옹호하다"],
  ["deplete", "고갈시키다"],
  ["greenwash", "위장 환경주의"],
  ["trade-off", "균형, 절충"],
  ["unsustainable", "지속 불가능한"],
  ["occupational burnout", "직업적 소진"],
  ["prolonged", "장기적인, 오래 지속된"],
  ["chronic strain", "만성적 부담"],
  ["overtraining syndrome", "과훈련 증후군"],
  ["underrecovery", "불충분한 회복"],
  ["intensification", "강화, 심화"],
  ["paradox", "역설"]
];

// 상태 관리
let state = {
  mode: 'card',
  currentIndex: 0,
  words: [...vocabulary],
  isFlipped: false,
  starred: new Set(JSON.parse(localStorage.getItem('starredWords') || '[]')),
  quiz: { current: null, correct: 0, wrong: 0 }
};

// DOM 요소
const $ = id => document.getElementById(id);

// 토스트 메시지
function showToast(msg) {
  const toast = $('toast');
  toast.textContent = msg;
  toast.classList.add('show');
  setTimeout(() => toast.classList.remove('show'), 2000);
}

// 카드 표시
function renderCard() {
  if (state.words.length === 0) {
    $('wordEn').textContent = '단어가 없습니다';
    $('wordKo').textContent = '-';
    return;
  }
  const word = state.words[state.currentIndex];
  $('wordEn').textContent = word[0];
  $('wordKo').textContent = word[1];
  $('card').classList.remove('flipped');
  state.isFlipped = false;
  
  // 즐겨찾기 표시
  const starBtn = $('starBtn');
  if (state.starred.has(word[0])) {
    starBtn.textContent = '★';
    starBtn.classList.add('active');
  } else {
    starBtn.textContent = '☆';
    starBtn.classList.remove('active');
  }
  
  updateProgress();
}

// 진도 업데이트
function updateProgress() {
  const total = state.words.length;
  const current = total > 0 ? state.currentIndex + 1 : 0;
  $('progressText').textContent = `${current} / ${total}`;
  $('progressFill').style.width = total > 0 ? `${(current / total) * 100}%` : '0%';
}

// 리스트 렌더링
function renderList() {
  const list = $('wordList');
  if (state.words.length === 0) {
    list.innerHTML = '<div style="padding:40px;text-align:center;color:#9ca3af;">검색 결과가 없습니다</div>';
    return;
  }
  list.innerHTML = state.words.map((w, i) => `
    <div class="word-item">
      <div class="word-item-en">${w[0]}</div>
      <div class="word-item-ko">${w[1]}</div>
      <button class="word-item-star ${state.starred.has(w[0]) ? 'active' : ''}" data-word="${w[0]}">
        ${state.starred.has(w[0]) ? '★' : '☆'}
      </button>
    </div>
  `).join('');
  
  list.querySelectorAll('.word-item-star').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation();
      const word = btn.dataset.word;
      toggleStar(word);
      renderList();
    });
  });
  
  $('progressText').textContent = `총 ${state.words.length}개 단어`;
  $('progressFill').style.width = '100%';
}

// 즐겨찾기 토글
function toggleStar(word) {
  if (state.starred.has(word)) {
    state.starred.delete(word);
  } else {
    state.starred.add(word);
  }
  localStorage.setItem('starredWords', JSON.stringify([...state.starred]));
}

// 퀴즈 생성
function generateQuiz() {
  const pool = state.words.length >= 4 ? state.words : vocabulary;
  if (pool.length < 4) return;
  
  const correctIdx = Math.floor(Math.random() * pool.length);
  const correct = pool[correctIdx];
  
  const options = [correct];
  while (options.length < 4) {
    const candidate = vocabulary[Math.floor(Math.random() * vocabulary.length)];
    if (!options.find(o => o[1] === candidate[1])) {
      options.push(candidate);
    }
  }
  
  // 섞기
  for (let i = options.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [options[i], options[j]] = [options[j], options[i]];
  }
  
  state.quiz.current = correct;
  $('quizWord').textContent = correct[0];
  $('quizOptions').innerHTML = options.map(o => 
    `<button class="quiz-option" data-meaning="${o[1]}">${o[1]}</button>`
  ).join('');
  
  $('quizOptions').querySelectorAll('.quiz-option').forEach(btn => {
    btn.addEventListener('click', () => handleQuizAnswer(btn));
  });
  
  $('quizResult').textContent = `정답: ${state.quiz.correct} / 오답: ${state.quiz.wrong}`;
}

function handleQuizAnswer(btn) {
  const selected = btn.dataset.meaning;
  const correct = state.quiz.current[1];
  
  $('quizOptions').querySelectorAll('.quiz-option').forEach(b => {
    b.style.pointerEvents = 'none';
    if (b.dataset.meaning === correct) b.classList.add('correct');
    else if (b === btn) b.classList.add('wrong');
  });
  
  if (selected === correct) state.quiz.correct++;
  else state.quiz.wrong++;
  
  setTimeout(generateQuiz, 1200);
}

// 모드 전환
function switchMode(mode) {
  state.mode = mode;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector(`.tab[data-mode="${mode}"]`).classList.add('active');
  
  $('cardMode').style.display = 'none';
  $('listMode').style.display = 'none';
  $('quizMode').style.display = 'none';
  
  // 단어 목록 필터링
  const search = $('searchInput').value.toLowerCase().trim();
  if (mode === 'star') {
    state.words = vocabulary.filter(w => state.starred.has(w[0]));
  } else {
    state.words = [...vocabulary];
  }
  
  if (search) {
    state.words = state.words.filter(w => 
      w[0].toLowerCase().includes(search) || w[1].toLowerCase().includes(search)
    );
  }
  
  state.currentIndex = 0;
  
  if (mode === 'card' || mode === 'star') {
    $('cardMode').style.display = 'block';
    renderCard();
  } else if (mode === 'list') {
    $('listMode').style.display = 'block';
    renderList();
  } else if (mode === 'quiz') {
    $('quizMode').style.display = 'block';
    if (state.words.length < 4) state.words = [...vocabulary];
    generateQuiz();
  }
}

// 이벤트 등록
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => switchMode(tab.dataset.mode));
});

$('card').addEventListener('click', e => {
  if (e.target.id === 'starBtn') return;
  $('card').classList.toggle('flipped');
  state.isFlipped = !state.isFlipped;
});

$('starBtn').addEventListener('click', e => {
  e.stopPropagation();
  const word = state.words[state.currentIndex];
  if (!word) return;
  toggleStar(word[0]);
  renderCard();
});

$('prevBtn').addEventListener('click', () => {
  if (state.currentIndex > 0) {
    state.currentIndex--;
    renderCard();
  }
});

$('nextBtn').addEventListener('click', () => {
  if (state.currentIndex < state.words.length - 1) {
    state.currentIndex++;
    renderCard();
  } else {
    showToast('마지막 단어입니다');
  }
});

$('shuffleBtn').addEventListener('click', () => {
  for (let i = state.words.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [state.words[i], state.words[j]] = [state.words[j], state.words[i]];
  }
  state.currentIndex = 0;
  if (state.mode === 'card' || state.mode === 'star') renderCard();
  else if (state.mode === 'list') renderList();
  showToast('🔀 단어를 섞었습니다');
});

$('searchInput').addEventListener('input', () => {
  switchMode(state.mode);
});

// 공유 기능
$('shareBtn').addEventListener('click', () => {
  $('shareModal').classList.add('active');
});

$('closeModalBtn').addEventListener('click', () => {
  $('shareModal').classList.remove('active');
});

$('shareModal').addEventListener('click', e => {
  if (e.target.id === 'shareModal') $('shareModal').classList.remove('active');
});

$('copyUrlBtn').addEventListener('click', async () => {
  try {
    await navigator.clipboard.writeText(window.location.href);
    showToast('✅ URL이 복사되었습니다');
    $('shareModal').classList.remove('active');
  } catch {
    showToast('복사에 실패했습니다');
  }
});

$('shareNativeBtn').addEventListener('click', async () => {
  if (navigator.share) {
    try {
      await navigator.share({
        title: '수능특강 영어 어휘장',
        text: '수능특강 영어 어휘를 함께 공부해요!',
        url: window.location.href
      });
      $('shareModal').classList.remove('active');
    } catch {}
  } else {
    showToast('이 브라우저는 공유 기능을 지원하지 않습니다');
  }
});

// 키보드 지원
document.addEventListener('keydown', e => {
  if (state.mode !== 'card' && state.mode !== 'star') return;
  if (document.activeElement === $('searchInput')) return;
  if (e.key === 'ArrowLeft') $('prevBtn').click();
  else if (e.key === 'ArrowRight') $('nextBtn').click();
  else if (e.key === ' ') {
    e.preventDefault();
    $('card').click();
  }
});

// 스와이프 제스처
let touchStartX = 0;
$('card').addEventListener('touchstart', e => {
  touchStartX = e.changedTouches[0].screenX;
}, { passive: true });

$('card').addEventListener('touchend', e => {
  const diff = e.changedTouches[0].screenX - touchStartX;
  if (Math.abs(diff) > 80) {
    if (diff > 0) $('prevBtn').click();
    else $('nextBtn').click();
  }
}, { passive: true });

// 초기화
$('totalCount').textContent = `전체 ${vocabulary.length}개 단어`;
renderCard();
</script>

</body>
</html>
