<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>영어 지문 학습 페이지 (Gemini)</title>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: 'Noto Sans KR', sans-serif;
    margin: 0;
    padding: 0;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    color: #333;
  }
  .container { max-width: 1100px; margin: 0 auto; padding: 30px 20px; }
  h1 { text-align: center; color: white; margin-bottom: 20px; font-size: 28px; }
  .setup-panel {
    background: white; padding: 20px; border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.15); margin-bottom: 20px;
  }
  .setup-panel input, .setup-panel textarea, .setup-panel select {
    width: 100%; padding: 10px; margin: 8px 0;
    border: 1px solid #ccc; border-radius: 6px; font-size: 14px;
  }
  .setup-panel textarea { height: 130px; resize: vertical; }
  button {
    cursor: pointer; padding: 10px 18px; border: none; border-radius: 6px;
    font-size: 14px; background: #3498db; color: white; transition: all 0.2s;
    margin-right: 6px;
  }
  button:hover { background: #2980b9; transform: translateY(-1px); }
  button:disabled { background: #aaa; cursor: not-allowed; }

  .slide-area {
    background: white; border-radius: 16px; padding: 40px;
    min-height: 500px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: none;
  }
  .progress { text-align: center; color: #777; font-size: 14px; margin-bottom: 20px; }
  .sentence-display {
    font-size: 26px; line-height: 1.6; text-align: center;
    padding: 30px 20px; margin-bottom: 25px; background: #fff8c4;
    border-radius: 12px; border-left: 6px solid #f39c12;
    color: #2c3e50; font-weight: 500;
  }
  .btn-group {
    display: flex; justify-content: center; gap: 10px;
    margin-bottom: 20px; flex-wrap: wrap;
  }
  .vocab-btn { background: #27ae60; }
  .vocab-btn:hover { background: #1e8449; }
  .grammar-btn { background: #8e44ad; }
  .grammar-btn:hover { background: #6c3483; }
  .trans-btn { background: #e67e22; }
  .trans-btn:hover { background: #ca6a1b; }

  .info-box {
    display: none; background: #ecf0f1; padding: 20px;
    border-radius: 10px; font-size: 16px; line-height: 1.8;
    margin-top: 15px;
  }
  .info-box.active { display: block; }
  .info-box h3 {
    margin-top: 0; color: #2c3e50;
    border-bottom: 2px solid #bdc3c7; padding-bottom: 8px;
  }

  .nav-buttons { display: flex; justify-content: space-between; margin-top: 30px; }
  .nav-buttons button { background: #2c3e50; padding: 12px 24px; font-size: 16px; }
  .nav-buttons button:hover { background: #1a252f; }

  .loading { text-align: center; color: #3498db; font-style: italic; padding: 20px; }
  .error-box {
    background: #ffe6e6; color: #c0392b; padding: 15px;
    border-radius: 8px; border-left: 4px solid #c0392b;
    font-size: 14px; white-space: pre-wrap;
  }
  .success-box {
    background: #d4edda; color: #155724; padding: 10px;
    border-radius: 6px; font-size: 14px;
  }
  .api-note { font-size: 12px; color: #888; margin-top: 5px; }
  .api-note a { color: #3498db; }
  .button-row { margin-top: 10px; display: flex; flex-wrap: wrap; gap: 6px; }
</style>
</head>
<body>

<div class="container">
  <h1>📘 영어 지문 학습 페이지 <span style="font-size:16px;">(Gemini AI)</span></h1>

  <div class="setup-panel" id="setupPanel">
    <label><b>🔑 Gemini API Key</b></label>
    <input type="password" id="apiKey" placeholder="AIza로 시작하는 키 입력" />
    <div class="api-note">
      ※ <a href="https://aistudio.google.com/app/apikey" target="_blank">Google AI Studio</a>에서 무료 발급<br>
      ※ API Key는 브라우저에만 저장됩니다.
    </div>

    <label style="display:block; margin-top:15px;"><b>🤖 모델 선택</b></label>
    <select id="modelSelect">
      <option value="gemini-2.5-flash">gemini-2.5-flash (최신, 추천)</option>
      <option value="gemini-2.5-pro">gemini-2.5-pro (정확도 최고)</option>
      <option value="gemini-2.0-flash" selected>gemini-2.0-flash (안정, 빠름)</option>
      <option value="gemini-2.0-flash-lite">gemini-2.0-flash-lite (가장 빠름)</option>
      <option value="gemini-1.5-flash">gemini-1.5-flash (구버전)</option>
      <option value="gemini-1.5-pro">gemini-1.5-pro (구버전)</option>
    </select>

    <label style="display:block; margin-top:15px;"><b>📄 영어 지문</b></label>
    <textarea id="inputText" placeholder="여기에 영어 지문을 붙여넣으세요..."></textarea>

    <div class="button-row">
      <button onclick="testApi()" style="background:#16a085;">🔌 API 연결 테스트</button>
      <button onclick="listModels()" style="background:#7f8c8d;">📋 사용 가능한 모델 조회</button>
      <button onclick="startLearning()">🚀 학습 시작</button>
    </div>

    <div id="testResult" style="margin-top:15px;"></div>
  </div>

  <div class="slide-area" id="slideArea">
    <div class="progress" id="progress"></div>
    <div class="sentence-display" id="sentenceDisplay"></div>

    <div class="btn-group">
      <button class="vocab-btn" onclick="showInfo('vocab')">📖 중요 어휘</button>
      <button class="grammar-btn" onclick="showInfo('grammar')">✏️ 주요 어법</button>
      <button class="trans-btn" onclick="showInfo('trans')">🌐 해석</button>
    </div>

    <div class="info-box" id="infoBox"></div>

    <div class="nav-buttons">
      <button onclick="prevSentence()">◀ 이전 문장</button>
      <button onclick="resetAll()" style="background:#c0392b;">🔄 처음으로</button>
      <button onclick="nextSentence()">다음 문장 ▶</button>
    </div>
  </div>
</div>

<script>
let sentences = [];
let currentIndex = 0;
let cache = {};

function getApiKey() {
  return document.getElementById('apiKey').value.trim();
}

function getModel() {
  return document.getElementById('modelSelect').value;
}

// ============ API 연결 테스트 ============
async function testApi() {
  const resultBox = document.getElementById('testResult');
  const apiKey = getApiKey();

  if (!apiKey) {
    resultBox.innerHTML = '<div class="error-box">API Key를 입력하세요.</div>';
    return;
  }
  if (!apiKey.startsWith('AIza')) {
    resultBox.innerHTML = '<div class="error-box">⚠️ Gemini API Key는 보통 "AIza"로 시작합니다. 키를 다시 확인하세요.</div>';
    return;
  }

  resultBox.innerHTML = '<div class="loading">🔌 연결 테스트 중...</div>';

  try {
    const result = await callGemini('Say "OK" only.');
    resultBox.innerHTML = `<div class="success-box">✅ 연결 성공! 응답: ${result.substring(0, 80)}</div>`;
  } catch (err) {
    resultBox.innerHTML = `<div class="error-box">❌ 연결 실패\n${err.message}</div>`;
  }
}

// ============ 사용 가능한 모델 조회 ============
async function listModels() {
  const resultBox = document.getElementById('testResult');
  const apiKey = getApiKey();

  if (!apiKey) {
    resultBox.innerHTML = '<div class="error-box">API Key를 입력하세요.</div>';
    return;
  }

  resultBox.innerHTML = '<div class="loading">📋 모델 목록 조회 중...</div>';

  try {
    const url = `https://generativelanguage.googleapis.com/v1beta/models?key=${apiKey}`;
    const res = await fetch(url);
    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error?.message || '조회 실패');
    }

    const usable = data.models
      .filter(m => m.supportedGenerationMethods?.includes('generateContent'))
      .map(m => m.name.replace('models/', ''));

    resultBox.innerHTML = `
      <div class="success-box">
        ✅ 사용 가능한 모델 (${usable.length}개):<br>
        <div style="margin-top:8px; font-family:monospace; font-size:13px; max-height:200px; overflow-y:auto;">
          ${usable.map(m => `• ${m}`).join('<br>')}
        </div>
      </div>
    `;
  } catch (err) {
    resultBox.innerHTML = `<div class="error-box">❌ 조회 실패\n${err.message}</div>`;
  }
}

// ============ 학습 시작 ============
function startLearning() {
  const text = document.getElementById('inputText').value.trim();
  const apiKey = getApiKey();

  if (!apiKey) { alert('Gemini API Key를 입력하세요.'); return; }
  if (!text) { alert('지문을 입력하세요.'); return; }

  sentences = text.match(/[^.!?]+[.!?]+/g)?.map(s => s.trim()) || [text];
  currentIndex = 0;
  cache = {};

  document.getElementById('setupPanel').style.display = 'none';
  document.getElementById('slideArea').style.display = 'block';
  renderSentence();
}

function renderSentence() {
  document.getElementById('progress').textContent =
    `${currentIndex + 1} / ${sentences.length}`;
  document.getElementById('sentenceDisplay').textContent = sentences[currentIndex];
  document.getElementById('infoBox').classList.remove('active');
  document.getElementById('infoBox').innerHTML = '';
}

function nextSentence() {
  if (currentIndex < sentences.length - 1) {
    currentIndex++; renderSentence();
  } else { alert('마지막 문장입니다.'); }
}

function prevSentence() {
  if (currentIndex > 0) {
    currentIndex--; renderSentence();
  } else { alert('첫 번째 문장입니다.'); }
}

function resetAll() {
  if (confirm('처음 화면으로 돌아갈까요?')) {
    document.getElementById('setupPanel').style.display = 'block';
    document.getElementById('slideArea').style.display = 'none';
  }
}

// ============ 어휘/어법/해석 표시 ============
async function showInfo(type) {
  const infoBox = document.getElementById('infoBox');
  infoBox.classList.add('active');

  if (cache[currentIndex] && cache[currentIndex][type]) {
    displayInfo(type, cache[currentIndex][type]);
    return;
  }

  infoBox.innerHTML = '<div class="loading">⏳ Gemini AI가 분석 중입니다...</div>';

  const prompts = {
    vocab: `당신은 한국 고등학교 영어 교사입니다.
다음 영어 문장에서 고등학교 수준 이상의 중요 어휘를 최대 5개 추출해 주세요.
각 항목은 다음 형식으로 한 줄씩 작성하세요:
• 단어 (품사): 뜻 - 문장 속 의미
다른 서론이나 부가 설명 없이 목록만 출력하세요.

문장: "${sentences[currentIndex]}"`,

    grammar: `당신은 한국 고등학교 영어 교사입니다.
다음 영어 문장에서 사용된 주요 어법/문법 포인트를 분석해 주세요.
각 항목은 다음 형식으로 한 줄씩 작성하세요:
• 어법 이름: 설명 - 문장에서의 예시
다른 서론이나 부가 설명 없이 목록만 출력하세요.

문장: "${sentences[currentIndex]}"`,

    trans: `다음 영어 문장을 자연스러운 한국어로 해석해 주세요.
해석만 출력하고, 다른 설명은 하지 마세요.

문장: "${sentences[currentIndex]}"`
  };

  try {
    const result = await callGemini(prompts[type]);
    if (!cache[currentIndex]) cache[currentIndex] = {};
    cache[currentIndex][type] = result;
    displayInfo(type, result);
  } catch (err) {
    infoBox.innerHTML = `<div class="error-box">❌ 오류 발생\n${err.message}</div>`;
  }
}

function displayInfo(type, content) {
  const titles = {
    vocab: '📖 중요 어휘',
    grammar: '✏️ 주요 어법',
    trans: '🌐 해석'
  };
  const formatted = content.replace(/\n/g, '<br>');
  document.getElementById('infoBox').innerHTML =
    `<h3>${titles[type]}</h3>${formatted}`;
}

// ============ Gemini API 호출 ============
async function callGemini(promptText) {
  const apiKey = getApiKey();
  const model = getModel();

  const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;

  let response;
  try {
    response = await fetch(url, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        contents: [{
          role: 'user',
          parts: [{ text: promptText }]
        }],
        generationConfig: {
          temperature: 0.3,
          maxOutputTokens: 1024,
          topP: 0.95
        }
      })
    });
  } catch (networkErr) {
    throw new Error(`네트워크 오류: ${networkErr.message}\n(CORS 문제이거나 인터넷 연결을 확인하세요)`);
  }

  const rawText = await response.text();
  let data;
  try {
    data = JSON.parse(rawText);
  } catch {
    throw new Error(`응답 파싱 실패:\n${rawText.substring(0, 300)}`);
  }

  if (!response.ok) {
    const msg = data.error?.message || JSON.stringify(data);
    const status = data.error?.status || response.status;
    throw new Error(`[${status}] ${msg}`);
  }

  if (data.promptFeedback?.blockReason) {
    throw new Error(`안전 필터 차단: ${data.promptFeedback.blockReason}`);
  }

  const candidate = data.candidates?.[0];
  if (!candidate) {
    throw new Error(`응답에 candidates가 없습니다:\n${JSON.stringify(data).substring(0, 300)}`);
  }

  if (candidate.finishReason === 'SAFETY') {
    throw new Error('응답이 안전 정책에 의해 차단되었습니다.');
  }

  const text = candidate.content?.parts?.[0]?.text;
  if (!text) {
    throw new Error(`응답 텍스트가 비어있습니다:\n${JSON.stringify(candidate).substring(0, 300)}`);
  }

  return text;
}

// ============ 키보드 단축키 ============
document.addEventListener('keydown', (e) => {
  if (document.getElementById('slideArea').style.display === 'none') return;
  if (e.key === 'ArrowRight') nextSentence();
  if (e.key === 'ArrowLeft') prevSentence();
});
</script>

</body>
</html>
